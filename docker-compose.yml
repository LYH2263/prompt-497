version: '3.8'

services:
  # Database Service
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_DB=mems
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "35432:5432"
    networks:
      - mems-network

  # Backend Service
  backend:
    build: ./backend
    restart: always
    ports:
      - "38081:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/mems
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      - db
    networks:
      - mems-network

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "38080:80"
    depends_on:
      - backend
    networks:
      - mems-network

networks:
  mems-network:
    driver: bridge

volumes:
  postgres_data:
